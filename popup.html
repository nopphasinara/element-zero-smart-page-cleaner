<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Element Zero Manager</title>
  <style>
    body { width: 310px; font-family: sans-serif; padding: 12px; margin: 0; background: #f9f9f9; }
    h3 { margin-top: 0; font-size: 13px; color: #333; margin-bottom: 6px; }
    .domain-badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; word-break: break-all; }
    .sync-status { font-size: 11px; color: #137333; background: #e6f4ea; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; }
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; }
    input[type="text"] { flex: 1; padding: 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 6px 10px; font-size: 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1557b0; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 140px; overflow-y: auto; margin-bottom: 10px; }
    li { display: flex; justify-content: space-between; align-items: center; background: white; padding: 6px 8px; margin-bottom: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; word-break: break-all; }
    li button { background: #d93025; padding: 2px 6px; font-size: 10px; }
    li button:hover { background: #a51d11; }
    .empty-text { font-size: 11px; color: #666; text-align: center; padding: 10px; }
    .backup-section { border-top: 1px solid #ddd; padding-top: 10px; display: flex; gap: 6px; }
    .backup-section button { flex: 1; background: #5f6368; font-size: 11px; }
    .backup-section button:hover { background: #3c4043; }
    #importFile { display: none; }
  </style>
</head>
<body>
  <div class="sync-status">☁️ Google Sync & Backup Connected</div>
  
  <h3>Current Website:</h3>
  <div id="currentDomain" class="domain-badge">Loading...</div>
  
  <div class="input-group">
    <input type="text" id="selectorInput" placeholder="e.g. div[jsname='...']">
    <button id="addBtn">Add</button>
  </div>
  <ul id="selectorList"></ul>

  <div class="backup-section">
    <button id="exportBtn">📥 Backup (JSON)</button>
    <button id="importBtn">📤 Restore</button>
    <input type="file" id="importFile" accept=".json">
  </div>

  <script src="popup.js"></script>
</body>
</html>
